name: Android bug report
description: Report a reproducible problem with the experimental Android port (without proprietary game files)
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Please check docs/STATUS.md first. Do not upload Terraria executables, proprietary assets, signing keys or unsanitized personal logs.
  - type: input
    id: build
    attributes:
      label: Tested tML Android version
      description: Include the actual installed APK version, not only a source branch.
      placeholder: "0.2.17"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: "Device model, SoC, Android version"
    validations:
      required: true
  - type: dropdown
    id: renderer
    attributes:
      label: Renderer
      options:
        - OpenGL
        - Vulkan / SDL GPU (experimental)
        - Not applicable / unknown
    validations:
      required: true
  - type: textarea
    id: mods
    attributes:
      label: Active mods
      description: List mod names and versions, or say none.
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Tap...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result and sanitized logs
      description: Paste only relevant, non-sensitive portions. For a performance issue, include FPS and draw/update/present frame metrics.
    validations:
      required: true
