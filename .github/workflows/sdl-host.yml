name: Android SDL game host
on:
  push:
    paths: ['src/Tml.Game.Android/**', 'tests/Tml.Host.Tests/**', 'integration/native/**', 'tools/build_native.py', 'tools/smoke_sdl_host.sh', 'tools/verify_probe_frame.py', '.github/workflows/sdl-host.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.100'
      - name: Check native crash report decoder
        run: dotnet run --project tests/Tml.Host.Tests -c Release
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install pinned toolchain
        run: |
          dotnet workload install android --version 10.0.100
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Prepare pinned sources
        run: |
          python3 -m pip install Pillow==12.0.0
          git clone --depth 1 --branch release-3.4.20 https://github.com/libsdl-org/SDL.git vendor/sdl
          git clone --no-checkout https://github.com/tModLoader/FNA.git vendor/fna
          git -C vendor/fna checkout 48d51381ec303aed06aa84e24c8562bf42d25dd6
          git -C vendor/fna submodule update --init --recursive
          python3 tools/prepare_fna.py vendor/fna artifacts/fna-mobile
      - name: Build Android native libraries
        run: |
          python3 tools/build_native.py vendor/sdl vendor/fna "$ANDROID_HOME" artifacts/android-native
          python3 tools/build_native.py vendor/sdl vendor/fna "$ANDROID_HOME" artifacts/android-native --abi x86_64
      - name: Build ARM64 host and check package
        run: |
          dotnet build src/Tml.Game.Android -c Release -m:1 -nr:false -t:SignAndroidPackage -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" -p:TmlMobileFnaProject="$PWD/artifacts/fna-mobile/FNA.Core.csproj" -p:TmlNativeDirectory="$PWD/artifacts/android-native"
          python3 tools/verify_mobile_apk.py src/Tml.Game.Android/bin/Release/net10.0-android/android-arm64/*-Signed.apk --game-host
          python3 tools/verify_jni_startup.py src/Tml.Game.Android/obj/Release/net10.0-android/android-arm64/android/src src/Tml.Game.Android/bin/Release/net10.0-android/android-arm64/*-Signed.apk --game-host
      - name: Build emulator host
        run: dotnet build src/Tml.Game.Android -c Release -m:1 -nr:false -t:SignAndroidPackage -p:RuntimeIdentifier=android-x64 -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" -p:TmlMobileFnaProject="$PWD/artifacts/fna-mobile/FNA.Core.csproj" -p:TmlNativeDirectory="$PWD/artifacts/android-native"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify real FNA frame
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tools/smoke_sdl_host.sh src/Tml.Game.Android/bin/Release/net10.0-android/android-x64/com.mantovani.tmlmobile-Signed.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdl-host-checks
          path: artifacts/sdl-smoke
